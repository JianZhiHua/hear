<svg viewBox="0 0 1220 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 10px; }
      .region-title { font-size: 11px; font-weight: 700; }
      .box-title { fill: #f8fafc; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .box-sub { fill: #94a3b8; font-size: 9px; text-anchor: middle; }
      .tiny { fill: #cbd5e1; font-size: 8px; text-anchor: middle; }
      .warn { fill: #fb7185; font-size: 9px; font-weight: 600; text-anchor: middle; }
      .allowed { fill: #34d399; font-size: 9px; font-weight: 600; text-anchor: middle; }
      .lane { fill: #0f172a; stroke-width: 1; stroke-dasharray: 8 5; rx: 14; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .arrow-good { fill: none; stroke: #34d399; stroke-width: 1.8; marker-end: url(#arrow-emerald); }
      .arrow-warn { fill: none; stroke: #fb7185; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow-rose); }
      .arrow-optional { fill: none; stroke: #fbbf24; stroke-width: 1.6; stroke-dasharray: 5 4; marker-end: url(#arrow-amber); }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1220" height="760" fill="#0f172a"/>
  <rect width="1220" height="760" fill="url(#grid)" opacity="0.85"/>

  <text x="36" y="38" class="title">hear：主 APP + 可选 QQ 音乐增强模块边界图</text>
  <text x="36" y="58" class="subtitle">主线保持系统监听与统一控制；登录态只允许存在于可选增强边界内，不能反向污染核心播放链路。</text>

  <!-- Region boundaries -->
  <rect x="34" y="90" width="690" height="590" class="lane" fill="none" stroke="#22d3ee"/>
  <text x="52" y="112" class="region-title" fill="#22d3ee">主 APP 核心域（默认可用，无登录）</text>

  <rect x="770" y="90" width="410" height="590" class="lane" fill="none" stroke="#fbbf24"/>
  <text x="788" y="112" class="region-title" fill="#fbbf24">可选 QQ 音乐增强模块（用户显式开启）</text>

  <rect x="746" y="120" width="1" height="520" fill="#334155"/>
  <text x="746" y="108" class="tiny" fill="#cbd5e1">模块边界</text>

  <!-- Main app boxes -->
  <g>
    <rect x="74" y="140" width="170" height="64" rx="7" fill="#0f172a"/>
    <rect x="74" y="140" width="170" height="64" rx="7" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="159" y="166" class="box-title">Compose UI</text>
    <text x="159" y="184" class="box-sub">当前播放 / 历史 / 悬浮歌词开关</text>
  </g>

  <g>
    <rect x="284" y="140" width="170" height="64" rx="7" fill="#0f172a"/>
    <rect x="284" y="140" width="170" height="64" rx="7" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="369" y="166" class="box-title">HearViewModel</text>
    <text x="369" y="184" class="box-sub">UI State / 用户命令</text>
  </g>

  <g>
    <rect x="494" y="140" width="185" height="64" rx="7" fill="#0f172a"/>
    <rect x="494" y="140" width="185" height="64" rx="7" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
    <text x="586.5" y="166" class="box-title">MusicAggregationEngine</text>
    <text x="586.5" y="184" class="box-sub">唯一当前音乐源 / 100ms 进度</text>
  </g>

  <g>
    <rect x="86" y="258" width="174" height="68" rx="7" fill="#0f172a"/>
    <rect x="86" y="258" width="174" height="68" rx="7" fill="rgba(30,41,59,0.54)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="173" y="284" class="box-title">MediaSession</text>
    <text x="173" y="302" class="box-sub">播放状态 / 进度 / 控制</text>
  </g>

  <g>
    <rect x="300" y="258" width="174" height="68" rx="7" fill="#0f172a"/>
    <rect x="300" y="258" width="174" height="68" rx="7" fill="rgba(30,41,59,0.54)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="387" y="284" class="box-title">NotificationListener</text>
    <text x="387" y="302" class="box-sub">通知歌词 / 蓝牙歌词兜底</text>
  </g>

  <g>
    <rect x="512" y="258" width="150" height="68" rx="7" fill="#0f172a"/>
    <rect x="512" y="258" width="150" height="68" rx="7" fill="rgba(76,29,149,0.38)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="587" y="284" class="box-title">Local Cache</text>
    <text x="587" y="302" class="box-sub">历史 / 去重 / 回退</text>
  </g>

  <g>
    <rect x="104" y="402" width="190" height="72" rx="7" fill="#0f172a"/>
    <rect x="104" y="402" width="190" height="72" rx="7" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
    <text x="199" y="429" class="box-title">Anonymous Search</text>
    <text x="199" y="447" class="box-sub">网易云 / QQ 公开搜索</text>
  </g>

  <g>
    <rect x="346" y="402" width="190" height="72" rx="7" fill="#0f172a"/>
    <rect x="346" y="402" width="190" height="72" rx="7" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
    <text x="441" y="429" class="box-title">Lyrics Sync Engine</text>
    <text x="441" y="447" class="box-sub">歌词匹配 / 当前行 Flow</text>
  </g>

  <g>
    <rect x="236" y="542" width="210" height="74" rx="7" fill="#0f172a"/>
    <rect x="236" y="542" width="210" height="74" rx="7" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="341" y="570" class="box-title">FloatingLyricsService</text>
    <text x="341" y="588" class="box-sub">WindowManager 悬浮歌词</text>
  </g>

  <!-- Optional module boxes -->
  <g>
    <rect x="812" y="142" width="150" height="64" rx="7" fill="#0f172a"/>
    <rect x="812" y="142" width="150" height="64" rx="7" fill="rgba(120,53,15,0.32)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="887" y="168" class="box-title">Opt-in Gate</text>
    <text x="887" y="186" class="box-sub">用户确认 / 风险提示</text>
  </g>

  <g>
    <rect x="1000" y="142" width="140" height="64" rx="7" fill="#0f172a"/>
    <rect x="1000" y="142" width="140" height="64" rx="7" fill="rgba(136,19,55,0.42)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="1070" y="168" class="box-title">QQ Login</text>
    <text x="1070" y="186" class="box-sub">扫码 / 验证码</text>
  </g>

  <g>
    <rect x="812" y="268" width="150" height="72" rx="7" fill="#0f172a"/>
    <rect x="812" y="268" width="150" height="72" rx="7" fill="rgba(136,19,55,0.42)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="887" y="296" class="box-title">Credential Vault</text>
    <text x="887" y="314" class="box-sub">musickey / refresh</text>
    <text x="887" y="328" class="box-sub">仅模块内可见</text>
  </g>

  <g>
    <rect x="1000" y="268" width="140" height="72" rx="7" fill="#0f172a"/>
    <rect x="1000" y="268" width="140" height="72" rx="7" fill="rgba(120,53,15,0.32)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1070" y="296" class="box-title">QQMusicApi Bridge</text>
    <text x="1070" y="314" class="box-sub">后端服务或隔离适配层</text>
  </g>

  <g>
    <rect x="812" y="430" width="150" height="78" rx="7" fill="#0f172a"/>
    <rect x="812" y="430" width="150" height="78" rx="7" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
    <text x="887" y="457" class="box-title">Enhanced Metadata</text>
    <text x="887" y="475" class="box-sub">账号歌单 / 收藏 / 匹配</text>
    <text x="887" y="489" class="box-sub">返回脱敏 DTO</text>
  </g>

  <g>
    <rect x="1000" y="430" width="140" height="78" rx="7" fill="#0f172a"/>
    <rect x="1000" y="430" width="140" height="78" rx="7" fill="rgba(30,41,59,0.54)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1070" y="457" class="box-title">QQ Music APIs</text>
    <text x="1070" y="475" class="box-sub">官方 Web/API 端点</text>
    <text x="1070" y="489" class="box-sub">遵守权限返回</text>
  </g>

  <g>
    <rect x="812" y="560" width="328" height="58" rx="7" fill="#0f172a"/>
    <rect x="812" y="560" width="328" height="58" rx="7" fill="rgba(136,19,55,0.32)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="976" y="584" class="warn">禁止进入主 APP 核心域</text>
    <text x="976" y="601" class="box-sub">Cookie / 登录态 / DRM 绕过 / 私有抓包播放链路</text>
  </g>

  <!-- External players -->
  <g>
    <rect x="74" y="692" width="190" height="44" rx="7" fill="#0f172a"/>
    <rect x="74" y="692" width="190" height="44" rx="7" fill="rgba(30,41,59,0.54)" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="169" y="719" class="box-title">网易云 / QQ音乐 / 本地播放器</text>
  </g>

  <!-- Arrows inside main -->
  <path class="arrow" d="M244 172 L284 172"/>
  <path class="arrow-good" d="M454 172 L494 172"/>
  <path class="arrow-good" d="M173 258 L173 230 L542 230 L542 204"/>
  <path class="arrow-good" d="M387 258 L387 230 L586 230 L586 204"/>
  <path class="arrow" d="M587 258 L587 204"/>
  <path class="arrow" d="M586 204 L586 362 L441 362 L441 402"/>
  <path class="arrow" d="M199 402 L199 362 L441 362"/>
  <path class="arrow-good" d="M441 474 L441 510 L341 510 L341 542"/>
  <path class="arrow" d="M341 542 L341 510 L586 510 L586 204"/>
  <path class="arrow-good" d="M169 692 L169 642 L173 642 L173 326"/>
  <path class="arrow-good" d="M211 692 L211 642 L387 642 L387 326"/>

  <!-- Optional flow -->
  <path class="arrow-optional" d="M962 174 L1000 174"/>
  <path class="arrow-warn" d="M1070 206 L1070 238 L887 238 L887 268"/>
  <path class="arrow-warn" d="M962 304 L1000 304"/>
  <path class="arrow-optional" d="M1070 340 L1070 430"/>
  <path class="arrow-good" d="M1000 469 L962 469"/>
  <path class="arrow-good" d="M887 430 L887 382 L724 382 L724 438 L536 438"/>
  <text x="668" y="370" class="allowed">只允许：SearchResult / Lyrics / CapabilityStatus</text>
  <text x="667" y="394" class="warn">不允许：Credential / Cookie / 播放绕过参数</text>

  <!-- Boundary rules -->
  <g>
    <rect x="600" y="548" width="110" height="70" rx="7" fill="#0f172a"/>
    <rect x="600" y="548" width="110" height="70" rx="7" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.5"/>
    <text x="655" y="575" class="box-title">Capability Port</text>
    <text x="655" y="593" class="box-sub">可选能力接口</text>
  </g>
  <path class="arrow-good" d="M812 469 L742 469 L742 583 L710 583"/>
  <path class="arrow-good" d="M600 583 L446 583"/>

  <!-- Legend -->
  <g>
    <rect x="34" y="704" width="1120" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="58" cy="724" r="5" fill="#34d399"/>
    <text x="68" y="727" fill="#cbd5e1" font-size="9">允许数据流：播放状态、歌词、元数据、能力状态</text>
    <circle cx="350" cy="724" r="5" fill="#fbbf24"/>
    <text x="360" y="727" fill="#cbd5e1" font-size="9">可选增强：用户显式开启，不影响默认体验</text>
    <circle cx="650" cy="724" r="5" fill="#fb7185"/>
    <text x="660" y="727" fill="#cbd5e1" font-size="9">隔离风险：登录态不进入主 APP，不作为播放核心依赖</text>
  </g>
</svg>
