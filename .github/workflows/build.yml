name: Build Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 自动递增版本号（patch +1）
      - name: Increment version
        if: github.ref == 'refs/heads/master'
        run: |
          # 读取当前版本
          VERSION=$(grep VERSION_NAME version.properties | cut -d'=' -f2)
          CODE=$(grep VERSION_CODE version.properties | cut -d'=' -f2)
          
          # 解析版本号
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # 递增 patch
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_CODE=$((CODE + 1))
          
          # 更新文件
          sed -i "s/VERSION_NAME=.*/VERSION_NAME=${NEW_VERSION}/" version.properties
          sed -i "s/VERSION_CODE=.*/VERSION_CODE=${NEW_CODE}/" version.properties
          
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "code=${NEW_CODE}" >> $GITHUB_OUTPUT
          
          # 提交版本更新
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add version.properties
          git commit -m "chore: bump version to ${NEW_VERSION}" || true
          git push || true

      - name: Read version
        id: version
        run: |
          VERSION=$(grep VERSION_NAME version.properties | cut -d'=' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate debug keystore for signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hear-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hear-release
          path: app/build/outputs/apk/release/*.apk

      # 构建成功后自动发布 Release（仅 master 分支）
      - name: Generate version tag
        if: success() && github.ref == 'refs/heads/master'
        id: tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APKs
        if: success() && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Hear ${{ steps.tag.outputs.tag }}"
          body: |
            ## Hear Music Player ${{ steps.tag.outputs.tag }}

            ### 下载
            - **app-release.apk** - Release 版本（推荐）
            - **app-debug.apk** - Debug 版本（调试用）

            ### 版本信息
            - Version: ${{ steps.version.outputs.version }}
            - Commit: `${{ github.sha }}`
            - Date: ${{ steps.tag.outputs.date }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
